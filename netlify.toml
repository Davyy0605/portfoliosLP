[build]
  # Sem SITE: publica o portfólio. Com SITE=<slug> (variável no painel do Netlify): publica só esse cliente.
  command = "pip install -r requirements.txt && python build.py ${SITE:+--site \"$SITE\"}"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Nomes sem hash: CSS e JS com cache de 1 dia; imagens 30 dias.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
