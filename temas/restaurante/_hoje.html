{# Destaca o prato do executivo do dia. Itens nomeados "Dia: prato" ("Segunda: ...", "Terça-feira: ...",
   "Terca: ..." também valem); sem prefixo, o item é mostrado como "Todo dia" e nunca é destacado.
   Sem script, ou sem prato para hoje, a semana inteira continua visível e o aviso fica oculto. #}
<script>
(function () {
  var dias = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var n = new Date().getDay();
  var hoje = dias[n];
  var fds = n === 0 || n === 6;
  function norm(s) {
    return String(s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/-feira$/, "").trim();
  }
  var alvo = norm(hoje);
  var aviso = document.querySelector("[data-hoje]");
  var achado = null;
  document.querySelectorAll("[data-dia]").forEach(function (el) {
    if (norm(el.getAttribute("data-dia")) === alvo) {
      el.classList.add("e-hoje");
      el.setAttribute("aria-current", "date");
      achado = achado || el;
    }
  });
  document.querySelectorAll(".categoria .item-nome").forEach(function (h) {
    var m = /^([^:]+):\s*(.+)$/.exec(h.textContent.trim());
    if (!m || norm(m[1]) !== alvo) return;
    var item = h.closest(".item");
    item.classList.add("e-hoje");
    var marca = document.createElement("span");
    marca.className = "marca-hoje";
    marca.textContent = "Hoje";
    h.prepend(marca);
    if (!achado) achado = { prato: m[2], preco: (item.querySelector(".item-preco") || {}).textContent || "" };
  });
  if (!aviso) return;
  if (achado) {
    var prato = (achado.prato || (achado.querySelector(".dia-prato") || {}).textContent || "").trim();
    prato = prato.charAt(0).toUpperCase() + prato.slice(1);
    var preco = achado.preco || (achado.querySelector(".dia-preco") || {}).textContent || "";
    aviso.textContent = "Hoje é " + hoje + (fds ? "" : "-feira") + ": " + prato + (preco ? ", " + preco.trim() : "") + ".";
  } else if (fds) {
    aviso.textContent = "Hoje é " + hoje + ": o executivo volta na segunda. A carta completa está servida.";
  } else {
    return; // dia útil sem prato correspondente: não inventa aviso
  }
  aviso.hidden = false;
})();
</script>
