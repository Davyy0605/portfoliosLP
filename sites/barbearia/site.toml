[capa]
titulo = "Corte no capricho, com hora marcada."
subtitulo = "Degradê, tesoura e barba de toalha quente num sobrado com luz de tarde na Barra Funda. Escolha o barbeiro e o horário em poucos toques."
imagem = "capa.jpg"
cta = "agendar"

[sobre]
titulo = "Um sobrado de 1931, três cadeiras e nenhuma pressa."
texto = "A Veneziana ocupa o térreo de um sobrado na Barra Funda, com pé-direito alto e as janelas de madeira que deram nome à casa. São só três cadeiras, então cada horário é marcado com folga: ninguém corta olhando para o relógio, e quem chega no seu horário senta na hora."
imagens = ["toalha.jpg", "navalha.jpg"]

# Os destaques são os serviços-assinatura da landing: o título deve ser igual ao nome do serviço
# para a página mostrar duração e preço. A lista completa fica em /agendar/.
[[destaques]]
titulo = "Degradê navalhado"
texto = "Do zero ao comprimento que você pedir, sem degrau aparente. A linha final sai na navalha, e a nuca é conferida no espelho de mão antes de você levantar."
imagem = "fade.jpg"

[[destaques]]
titulo = "Barba de toalha quente"
texto = "Duas toalhas quentes, óleo, espuma batida no pincel e navalha com lâmina nova, aberta na sua frente. Fecha com toalha fria e loção sem álcool."
imagem = "espuma.jpg"

[[destaques]]
titulo = "Combo corte + barba"
texto = "Setenta minutos na mesma cadeira, com o mesmo barbeiro do começo ao fim. É o pedido mais comum do sábado de manhã."
imagem = "barba.jpg"

