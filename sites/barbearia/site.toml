[[depoimentos]]
nome = "Rafael M."
texto = "Corto com o Renan há dois anos. O degradê segura até a terceira semana, e ele lembra como eu gosto sem eu precisar explicar de novo."
servico = "Degradê navalhado"

[[depoimentos]]
nome = "Otávio S."
texto = "A barba de toalha quente virou meu ritual de sexta. Saio sem nenhuma irritação, coisa que não acontecia em outro lugar."
servico = "Barba de toalha quente"

[[depoimentos]]
nome = "Diego F."
texto = "Levei meu filho de 7 anos e a Iara teve uma paciência enorme. Agora é ele que pede para voltar."
servico = "Corte infantil"

[[depoimentos]]
nome = "Leandro P."
texto = "Marquei pelo WhatsApp às 8h e às 9h já estava na cadeira. Pontualidade de verdade."
servico = "Combo corte + barba"

[[perguntas]]
pergunta = "Posso chegar sem horário marcado?"
resposta = "Se houver cadeira livre, encaixamos. Com horário marcado você não espera: são só três cadeiras e a agenda é feita com folga."

[[perguntas]]
pergunta = "Como funciona a confirmação?"
resposta = "Você envia o pedido pelo WhatsApp com serviço, barbeiro e horário, e a gente confirma por lá mesmo, normalmente em poucos minutos."

[[perguntas]]
pergunta = "E se eu me atrasar?"
resposta = "Seguramos o horário por 10 minutos. Depois disso, avisamos o próximo horário livre do mesmo barbeiro."

[[perguntas]]
pergunta = "Quais formas de pagamento vocês aceitam?"
resposta = "Pix, cartão de débito e crédito e dinheiro, no fim do atendimento."

