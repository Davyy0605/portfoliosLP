[capa]
titulo = "Fome grande pede burger maior."
subtitulo = "Blend de 160 g batido na casa, pão de batata macio e chapa sempre quente. Monte o pedido aqui e chame no WhatsApp."
imagem = "capa.jpg"
cta = "pedir"

[sobre]
titulo = "Nada de segredo: carne boa, chapa quente, mão pesada."
texto = "A Fornalha começou como um food truck de esquina e hoje tem casa na Savassi. A receita é a mesma desde o primeiro dia: blend de acém e peito moído na hora, prensado na chapa para criar crosta, pão de batata tostado na manteiga e molhos feitos aqui. Sem fila de espera de três horas, sem frescura."
imagens = ["chapa.jpg", "grelha.jpg"]

[[destaques]]
titulo = "Blend da casa"
texto = "Acém e peito moídos na hora, 160 g por burger, prensados na chapa até formar crosta. Pedido em dobro? É só pedir o Duplo."
imagem = "burger-duplo.jpg"

[[destaques]]
titulo = "Combos que fecham a conta"
texto = "Burger, fritas e bebida num preço só, com até R$ 12 de economia. Peça o Combo Fornalha e leve o adicional de bacon na casa às segundas."
imagem = "bandeja.jpg"

[[destaques]]
titulo = "Peça sem sair do sofá"
texto = "Escolha os itens, escreva a observação e envie o pedido pronto para o nosso WhatsApp. A gente confirma e já acende a chapa."
imagem = "burger-fries.jpg"

