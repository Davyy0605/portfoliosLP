[capa]
titulo = "Pele que aguenta a festa inteira."
subtitulo = "Noivas, madrinhas, formaturas e ensaios. Você senta no camarim, a luz do espelho acende e a make é feita para durar da primeira foto à última música."
imagem = "capa.jpg"
cta = "agendar"

[sobre]
titulo = "Doze lâmpadas, uma cadeira alta e tempo para conversar."
texto = "O estúdio é um camarim de teatro adaptado: espelho com lâmpadas de luz quente, a mesma luz difícil das fotos de festa. Antes do primeiro pincel a gente pergunta a ocasião, o vestido, o horário e a iluminação do lugar. Pele preparada com calma, produtos testados em pele real e você só levanta quando gostar do que vê no espelho."
imagens = ["sobre1.jpg"]

# Destaques = serviços-assinatura da landing. O título deve ser igual ao nome do serviço para mostrar duração e preço;
# a lista completa fica em /agendar/.
[[destaques]]
titulo = "Make glam de festa"
texto = "Olho esfumado, cílios e pele luminosa que não vira brilho no flash. Pensada para a luz de salão, aquela que apaga make leve e pesa em make carregada."
imagem = "r08.jpg"

[[destaques]]
titulo = "Make para ensaio fotográfico"
texto = "Acabamento pensado para a lente: pele sem brilho falso, contorno que aparece na luz de estúdio e delineado que aguenta close. Entre uma troca de look e outra, a gente ajusta a boca e o olhar."
imagem = "r02.jpg"

[[destaques]]
titulo = "Curso de automaquiagem"
texto = "Aula individual com os produtos da sua nécessaire. Você faz um lado do rosto, a gente faz o outro, e sai com o passo a passo anotado para repetir em casa."
imagem = "noiva1.jpg"

