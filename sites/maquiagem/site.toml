[[perguntas]]
pergunta = "Vocês atendem noivas e eventos fora do estúdio?"
resposta = "Sim. Marque o atendimento a domicílio e informe o bairro. O deslocamento para noivas e grupos é combinado pelo WhatsApp."

[[perguntas]]
pergunta = "Com quanto tempo de antecedência a noiva deve reservar?"
resposta = "O ideal é de três a seis meses antes, principalmente para sábados de maio a outubro. O teste de make pode ser feito até três semanas antes do casamento."

[[perguntas]]
pergunta = "Tenho pele sensível. Posso usar os produtos de vocês?"
resposta = "Pode. Avise na observação do agendamento: separamos produtos sem fragrância e fazemos um teste no pescoço antes de começar."

[[perguntas]]
pergunta = "Como funciona a confirmação do horário?"
resposta = "Você envia o pedido pelo WhatsApp e nós confirmamos o horário por lá."

