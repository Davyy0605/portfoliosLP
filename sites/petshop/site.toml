[[perguntas]]
pergunta = "Como sei o porte do meu pet?"
resposta = "Pequeno (P) vai até uns 10 kg, médio (M) até uns 25 kg e grande (G) acima disso. Se estiver em dúvida, escolha o mais próximo e confirmamos no WhatsApp."

[[perguntas]]
pergunta = "Quanto custa o táxi dog?"
resposta = "O valor depende da distância entre a sua casa e o pet spa, por isso combinamos pelo WhatsApp depois do agendamento."

[[perguntas]]
pergunta = "Meu pet precisa estar vacinado?"
resposta = "Sim. Pedimos vacinas em dia, vermifugação recente e antipulgas. Pets com pulgas ou carrapatos têm o banho ajustado, com valor combinado antes."

[[perguntas]]
pergunta = "Quanto tempo meu pet fica?"
resposta = "Em média, de uma a duas horas e meia, conforme o serviço e o porte. Avisamos pelo WhatsApp quando ele estiver pronto."

