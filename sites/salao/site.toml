texto = "A progressiva durou muito mais do que eu esperava e o cabelo ficou macio, não duro. Agendei tudo pelo WhatsApp."
servico = "Escova progressiva"

[[perguntas]]
pergunta = "Por que alguns serviços têm preço 'a partir de'?"
resposta = "Cor e progressiva dependem do comprimento e da quantidade de cabelo. A profissional confirma o valor final antes de começar."

[[perguntas]]
pergunta = "Preciso fazer teste de mecha antes de clarear?"
resposta = "Se o cabelo já tem química ou se a mudança for grande, sim. O teste leva 20 minutos, é gratuito e pode ser feito em qualquer horário livre da Helena."

[[perguntas]]
pergunta = "Como funciona a confirmação do horário?"
resposta = "Você envia o pedido pelo WhatsApp e nós confirmamos o horário por lá."

