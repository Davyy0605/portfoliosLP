[capa]
titulo = "Cor que acende com a luz. Corte que cai sozinho."
subtitulo = "Loiros, mechas, cobre e corte com movimento, sempre com uma conversa antes da tesoura e a cartela de cores na mão. Escolha a profissional e o horário em poucos toques."
imagem = "capa.jpg"
cta = "agendar"

[sobre]
titulo = "Um salão pequeno, com luz de janela."
texto = "O Ondina tem seis cadeiras, dois lavatórios e uma bancada de cor perto da janela, porque tom de loiro se confere na luz do dia. Antes de qualquer química, a profissional olha o fio, faz o teste de mecha se precisar e combina com você o resultado e o valor."
imagens = ["interior.jpg", "tigela.jpg"]

# Os destaques são os serviços-assinatura da landing: o título deve ser igual ao nome do serviço
# para a página mostrar duração e preço. A lista completa fica em /agendar/.
[[destaques]]
titulo = "Mechas e iluminado"
texto = "Papel alumínio fino, mecha por mecha, onde a luz bateria naturalmente. A Helena tonaliza no lavatório para tirar o amarelo e você sai com o loiro que combinou, não com o que sobrou."
imagem = "mechas.jpg"

[[destaques]]
titulo = "Corte feminino"
texto = "Cortado molhado para a forma e refinado seco para o movimento. A Beatriz corta pensando em como o cabelo cai no terceiro dia, não só na saída do salão."
imagem = "corte.jpg"

[[destaques]]
titulo = "Escova progressiva"
texto = "Alinhamento sem formol, aplicado mecha a mecha com prancha de titânio. O fio fica liso e com peso, sem aquele aspecto duro, e o comprimento é avaliado antes de começar."
imagem = "progressiva.jpg"

