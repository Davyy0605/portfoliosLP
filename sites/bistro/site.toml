[capa]
titulo = "O que está na lousa hoje"
subtitulo = "Cozinha de bistrô com ingredientes mineiros, um menu que muda todo dia e vinhos pequenos servidos sem cerimônia."
imagem = "capa.jpg"
cta = "reservar"

[sobre]
titulo = "Uma casa pequena, de conversa comprida"
texto = "O Entrelinhas ocupa um sobrado antigo de Santa Tereza, com 28 lugares, mesas de madeira e uma lousa na parede que a cozinha reescreve toda manhã. A chef Lívia Cantarino aprendeu o ofício entre Lyon e Belo Horizonte e cozinha como se cozinha para amigos: poucos ingredientes, bom molho, pão de fermentação natural. A carta de vinhos é curta de propósito, com rótulos de produtores pequenos que a casa conhece pelo nome."
imagens = ["sala.jpg", "cafe.jpg"]

[[destaques]]
titulo = "Menu do dia"
texto = "De terça a sexta, no almoço: entrada, prato e sobremesa escolhidos pela cozinha de manhã, a partir do que chegou do mercado. O cardápio fica escrito na lousa."
imagem = "frites.jpg"

[[destaques]]
titulo = "Jazz sem palco"
texto = "Duas vezes por mês, trio ao vivo a partir das 20h30, no canto da sala e sem pressa. Reserve para jantar e fique com a melhor mesa para ouvir."
imagem = "sax.jpg"

[[destaques]]
titulo = "Vinhos pequenos"
texto = "Vinte rótulos de produtores pequenos de Minas, do Sul do Brasil, de Portugal e da França. Todos por taça, a partir de R$ 28."
imagem = "mesa.jpg"

