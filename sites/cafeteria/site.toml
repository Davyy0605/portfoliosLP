[capa]
titulo = "Um café que merece a pausa."
subtitulo = "Grãos de pequenos produtores mineiros, torra clara e doces assados todas as manhãs."
imagem = "capa.jpg"
cta = "cardapio"

[sobre]
titulo = "Do pé de café à xícara, sem pressa"
texto = "Trabalhamos com microlotes da Mantiqueira, do Cerrado Mineiro e do Sul de Minas, torrados em pequenas bateladas e moídos na hora. Cada café traz no cardápio a fazenda de origem e o método de preparo que valoriza o grão. Na confeitaria, bolos, tortas e pães saem do forno ao longo do dia, com manteiga de verdade e açúcar na medida."
imagens = ["servindo.jpg", "espresso.jpg"]

[[destaques]]
titulo = "Cafés de origem, com ficha técnica"
texto = "Sempre dois a quatro microlotes em rotação. Perguntamos como você gosta e indicamos o grão e o método: espresso, V60, prensa francesa ou coado em Chemex."
imagem = "coado.jpg"

[[destaques]]
titulo = "Ambiente para trabalhar"
texto = "Wi-fi de 300 Mbps, tomadas em todas as mesas da varanda e do mezanino, luz natural e música baixa. Ficar duas horas com um notebook é bem-vindo; peça um café-hora, que inclui refil do filtrado do dia."
imagem = "mesa-notebook.jpg"

[[destaques]]
titulo = "Confeitaria da casa"
texto = "Bolo de cenoura com calda de chocolate, cheesecake de goiabada, croissant folhado de manteiga. Tudo feito de manhã, até acabar."
imagem = "bolo-chocolate.jpg"

[[destaques]]
titulo = "Siga a gente no Instagram"
texto = "O café da semana, as fornadas do dia e os eventos de degustação são anunciados em @cafepitangueira. Marque a sua xícara e a gente reposta."
imagem = "latte-coracao.jpg"

