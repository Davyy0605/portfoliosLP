[capa]
titulo = "Uma mesa, uma conversa longa"
subtitulo = "Sete passos de cozinha autoral, feitos com produtores do interior paulista e uma adega pensada para acompanhar cada um deles."
imagem = "capa.jpg"
cta = "reservar"

[sobre]
titulo = "O ofício de tecer sabores"
texto = "Tessitura nasceu da ideia de que um jantar é uma trama: ingredientes, tempo, vinho e conversa entrelaçados com paciência. A cozinha do chef Henrique Vasconcellos trabalha com poucos produtos por prato, escolhidos pela estação e pela mão de quem os planta, e deixa a técnica discreta para que o sabor fale primeiro. A sala tem apenas 11 mesas, o serviço é sem pressa e o menu muda a cada seis semanas."
imagens = ["sala.jpg", "salao.jpg"]

[[destaques]]
titulo = "Menu degustação em sete passos"
texto = "Do primeiro amuse-bouche à sobremesa, a sequência é pensada como um único texto. Opção com harmonização de vinhos, ou versão inteiramente vegetal."
imagem = "chef.jpg"

[[destaques]]
titulo = "Adega com 300 rótulos"
texto = "Vinhos de pequenos produtores do Brasil, Portugal, França e Itália, servidos por taça ou garrafa. O sommelier ajusta a harmonização ao seu paladar."
imagem = "adega.jpg"

[[destaques]]
titulo = "Dress code"
texto = "Esporte fino. Pedimos que evitem bermudas, regatas e chinelos. Não é preciso paletó, mas a noite pede um pouco de capricho."

[[destaques]]
titulo = "Reservas"
texto = "Aceitamos reservas com até 30 dias de antecedência, para grupos de 2 a 8 pessoas. Tolerância de 20 minutos. Restrições alimentares devem ser avisadas com 48 horas de antecedência. Cancelamentos até 24 horas antes, sem custo."

