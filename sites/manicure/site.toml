[capa]
titulo = "Unha feita de perto."
subtitulo = "Alongamento, esmaltação em gel e nail art numa bancada com luz de dia, lupa e o tempo que cada detalhe pede. Do formato ao último brilho, com hora marcada."
imagem = "n02.jpg"
cta = "agendar"

[sobre]
titulo = "Duas bancadas, luz de dia e nenhuma pressa."
texto = "O Lúnula é um ateliê pequeno num primeiro andar de Pinheiros. São só duas bancadas, de frente para a janela, porque cor de esmalte se escolhe com luz natural. Antes do primeiro passo a gente conversa sobre formato, comprimento e rotina, e só depois abre o alicate, que sai da autoclave lacrado na sua frente."
imagens = ["n01.jpg"]

# Serviços-assinatura da landing: o título deve ser igual ao nome do serviço para mostrar duração e preço.
# A lista completa fica em /agendar/.
[[destaques]]
titulo = "Alongamento em gel"
texto = "Molde sob a unha natural e gel construído em camadas finas, com o ápice no ponto em que a unha mais flexiona. Fica fina na lateral, firme no centro e no formato que você escolher: amendoada, quadrada, bailarina ou stiletto."
imagem = "n07.jpg"

[[destaques]]
titulo = "Esmaltação em gel"
texto = "A cutícula é recuada com calma, não arrancada. A unha natural recebe só o polimento que o gel precisa, base niveladora e duas camadas de cor curadas na cabine. Sai com brilho de espelho e dura de três a quatro semanas."
imagem = "n05.jpg"

[[destaques]]
titulo = "Nail art"
texto = "Cromado, casco de tartaruga, francesinha fina, pontos de ouro. Traga uma referência: o desenho é redesenhado para o tamanho das suas unhas, e o valor é combinado antes do primeiro traço."
imagem = "n15.jpg"

