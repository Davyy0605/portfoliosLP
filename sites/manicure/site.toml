[[perguntas]]
pergunta = "De quanto em quanto tempo faço a manutenção do alongamento?"
resposta = "Entre 20 e 25 dias, conforme o crescimento da unha. Passando disso, o gel perde apoio perto da cutícula e pode levantar."

[[perguntas]]
pergunta = "Posso levar uma foto de referência para a nail art?"
resposta = "Pode e deve. A profissional adapta o desenho ao tamanho e ao formato das suas unhas e combina o valor antes de começar."

[[perguntas]]
pergunta = "Como funciona a confirmação do horário?"
resposta = "Você envia o pedido pelo WhatsApp e nós confirmamos o horário por lá."

