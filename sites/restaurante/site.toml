[capa]
titulo = "Comida de casa, todo dia."
subtitulo = "Panela no fogo desde as sete da manhã, em Pinheiros. Executivo de segunda a sexta, carta completa à noite e aos fins de semana."
imagem = "capa.jpg"
cta = "reservar"

[sobre]
titulo = "Uma casa de comida, não de moda"
texto = "A Cozinha Imbuia nasceu de uma mesa de domingo: cozidos que pedem horas, molhos feitos na hora e porções para dividir. Compramos de pequenos produtores do interior paulista, temperamos sem pressa e servimos em pratos fundos, porque comida boa pede fartura. Venha almoçar entre reuniões, jantar com a família ou fechar a tarde de sábado com a gente."
imagens = ["familia.jpg", "cozinha.jpg"]

[[destaques]]
titulo = "Prato do dia, de segunda a sexta"
texto = "Um executivo por dia, com prato principal, arroz, feijão, guarnição e salada. Das 11h30 às 15h30, a partir de R$ 38,00. Veja a semana completa no cardápio."
imagem = "executivo-grelhado.jpg"

[[destaques]]
titulo = "Espaço família"
texto = "Mesas amplas, cadeirão, cardápio infantil e um canto de desenho para os pequenos. Aos sábados e domingos, as crianças até 6 anos não pagam o menu kids."
imagem = "criancas.jpg"

[[destaques]]
titulo = "Reservas para grupos"
texto = "Aceitamos reservas para 2 a 20 pessoas, inclusive almoços de empresa e comemorações. Chame no WhatsApp com dia, horário e número de pessoas."
imagem = "almoco.jpg"

