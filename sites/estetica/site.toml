[[perguntas]]
pergunta = "Preciso fazer avaliação antes do primeiro tratamento?"
resposta = "Para tratamentos faciais, sim. A avaliação dura 30 minutos e o valor é abatido no primeiro tratamento contratado."

[[perguntas]]
pergunta = "Como funcionam os pacotes de sessões?"
resposta = "Você contrata o pacote e agenda cada sessão pelo WhatsApp, no seu ritmo, dentro da validade informada. Cada sessão é marcada separadamente."

[[perguntas]]
pergunta = "Quantas sessões preciso para ver resultado?"
resposta = "Depende da pele e do objetivo. Na avaliação indicamos o número de sessões sem exagero, e você decide se prefere começar com uma só."

[[perguntas]]
pergunta = "Quem não deve fazer os tratamentos?"
resposta = "Gestantes, pessoas com lesões ativas na pele ou com algumas condições de saúde precisam de orientação antes. Avise na observação do agendamento."

[[perguntas]]
pergunta = "O que devo fazer antes da sessão?"
resposta = "Venha sem maquiagem e evite exposição intensa ao sol nos três dias anteriores. Para massagens, faça uma refeição leve antes."

