[capa]
titulo = "A noite tem cor de âmbar."
subtitulo = "Coquetelaria autoral, whiskies raros e palco aberto de terça a domingo, no coração de Pinheiros."
imagem = "capa.jpg"
cta = "reservar"

[sobre]
titulo = "Um balcão comprido, pouca luz e muito ofício."
texto = "O Âmbar 33 nasceu da vontade de ter um bar onde o drink é pensado como prato: cada receita parte de um ingrediente brasileiro, passa por infusões feitas na casa e chega ao copo sem exagero. Aqui o bartender conversa com você, a luz é baixa e a trilha é tocada por quem sobe no palco ao lado do balcão."
imagens = ["whisky2.jpg", "neon.jpg"]

[[destaques]]
titulo = "Drinks autorais"
texto = "Dez receitas que mudam por estação, com cachaça artesanal, frutas do Cerrado e xaropes feitos aqui. O Fumaça de Cumaru é o que a casa mais serve."
imagem = "drink-pour.jpg"

[[destaques]]
titulo = "Happy hour âmbar"
texto = "De terça a sexta, das 18h às 20h: todos os clássicos da casa pela metade do preço no primeiro copo e petiscos a partir de R$ 24."
imagem = "drink-laranja.jpg"

[[destaques]]
titulo = "Palco aberto"
texto = "Jazz, samba-rock e MPB ao vivo toda semana, num palco colado ao balcão. Sem ingresso: couvert artístico só nas noites de show."
imagem = "show-banda.jpg"

